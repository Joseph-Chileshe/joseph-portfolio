  <!-- Small style block for the list design -->

      align-items: center;

      border-radius: 8px;
      color: #334155; 
      text-decoration: none; 
      font-size: 1rem; 
      font-weight: 500; 
      transition: all 0.2s ease;
    }
    .contact-item:hover {
      border-color: #94A3B8;
      background-color: #F8FAFC;
      transform: translateX(4px); /* Slight slide effect on hover */
    }
    .contact-item i {
      font-size: 1.2rem;
      color: #64748B;
      width: 24px;
      text-align: center;
    }
  </style>
